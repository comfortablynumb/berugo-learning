  <meta name="description" content="Interactive platform for senior engineers: algorithms, data structures, automata and language theory, compilers, computer architecture, operating systems and systems engineering, with runnable JavaScript in every section.">

  <!-- Installable: manifest, icons and a service worker (sw.js). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Prebuilt Tailwind (npm run build:css). No CDN: the app runs offline. -->

</head>

  <div class="sidebar-overlay"></div>

    <div class="sidebar-footer">

    <header class="app-header">
      <button type="button" class="btn btn-sm lg:hidden" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>

        <span class="header-crumb" id="header-crumb"></span>
        <h2 id="header-title">Berugo Learning</h2>
      </div>

      <div class="header-search">
        <input type="search" id="global-search" autocomplete="off" spellcheck="false"
               placeholder="Search concepts, examples, reference (Ctrl+K)"
               aria-label="Search everything the platform teaches">
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="header-tools">
        <div class="text-scale" role="group" aria-label="Text size">

        </div>
        <button type="button" class="btn btn-sm" id="theme-toggle" title="Toggle light and dark">Theme</button>
        <button type="button" class="btn btn-sm" id="install-app" title="Install this app" hidden>Install</button>
      </div>
    </header>
